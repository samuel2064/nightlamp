name: Preflight the frontend deploy build

on:
  workflow_dispatch:
  push:
    branches:
      - ops/render-auth-config
    paths:
      - .github/workflows/preflight-frontend-build.yml

permissions:
  contents: write

env:
  REPORT_BRANCH: ops/render-auth-report

jobs:
  preflight:
    name: Build the frontend with the production env inputs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_BACKEND_URL: https://nightlamp-api.onrender.com
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Report which inputs are available
        run: |
          set -uo pipefail
          {
            echo "NEXT_PUBLIC_BACKEND_URL length=${#NEXT_PUBLIC_BACKEND_URL}"
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY length=${#NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
            echo "CLERK_SECRET_KEY length=${#CLERK_SECRET_KEY}"
          } | tee /tmp/preflight-inputs.txt
          {
            echo "## Preflight inputs"
            echo
            echo "- NEXT_PUBLIC_BACKEND_URL length: ${#NEXT_PUBLIC_BACKEND_URL}"
            echo "- NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY length: ${#NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
            echo "- CLERK_SECRET_KEY length: ${#CLERK_SECRET_KEY}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install frontend deps
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Publish the result
        if: always()
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          INPUTS=$(tr '\n' ';' < /tmp/preflight-inputs.txt 2>/dev/null || echo '')
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg inputs "$INPUTS" --arg conclusion "${{ job.status }}" \
            '{run:$run,sha:$sha,frontendBuild:$conclusion,inputs:$inputs,valuesIncluded:false}' > /tmp/preflight-report.json
          cat /tmp/preflight-report.json
          {
            echo "## Frontend deploy preflight"
            echo
            echo "- run: $GITHUB_RUN_ID"
            echo "- sha: $GITHUB_SHA"
            echo "- frontend build job: ${{ job.status }}"
            echo "- inputs: $INPUTS"
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "nightlamp-ci"
          git config user.email "ci@nightlamp.local"
          git fetch --depth=1 origin "$REPORT_BRANCH" || true
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout -B "$REPORT_BRANCH" FETCH_HEAD
          fi
          mkdir -p reports
          cp /tmp/preflight-report.json reports/frontend-preflight.json
          git add reports/frontend-preflight.json
          git commit -m "frontend deploy preflight report $GITHUB_RUN_ID" || true
          git push origin "HEAD:$REPORT_BRANCH"
