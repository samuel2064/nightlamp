name: Configure Render auth env vars

on:
  workflow_dispatch:
  push:
    branches:
      - ops/render-auth-config

permissions:
  contents: write

env:
  RENDER_API: https://api.render.com/v1
  CLERK_ISSUER: https://capable-goldfish-98.clerk.accounts.dev
  CLERK_INSTANCE: capable-goldfish-98.clerk.accounts.dev
  REPORT_BRANCH: ops/render-auth-report
  EXPECTED_BACKEND_SLUG: nightlamp-api
  EXPECTED_FRONTEND_SLUG: nightlamp-frontend

jobs:
  configure:
    name: Configure the Clerk auth variables on Render
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
      FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
      GITHUB_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      GITHUB_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_JWT_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA6+uwb+X/QKQQp/8A0Sy3
        bYmwSAPHnynUH4TEbt3RP3tH8/h4868CiJVDDXeORwwSKz8kcfFfZPt5OtLuzPUn
        yzTeDv0Lud9loahWP+aY/pnRgyGWHuk575jnJA8bRJtg+EIyZakQNNOH0Brs09DQ
        QMHHiH9YTSDkGyT7yZmH32cGFs2qoAAwxyM6nLy7MdQpWcat+RrGwKB1W4wIjLAI
        5EUNqNEuZniGogPlMyV1Bz1oiJWXlYr91hJDDiCPPzHtuow4g4DGybHguGlQUStk
        hESQfyn316/DTggeR4rZfKxNAbwba7/W0JPmqmsfyd2cwQkUUljhv2vjLx96GgHl
        5QIDAQAB
        -----END PUBLIC KEY-----
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Preflight
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY secret is missing or empty"; exit 1; }
          test -n "$BACKEND_SERVICE_ID" || { echo "::error::RENDER_BACKEND_SERVICE_ID secret is missing or empty"; exit 1; }
          echo "preflight ok"

      - name: List the Render services
        run: |
          set -uo pipefail
          : > /tmp/diag.log
          : > /tmp/services-list.txt
          STATUS=$(curl -sS -o /tmp/services.json -w "%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" "$RENDER_API/services")
          echo "GET /services -> HTTP $STATUS" >> /tmp/diag.log
          if [ "$STATUS" != "200" ]; then
            echo "::error::the Render API answered HTTP $STATUS for the service list"
            exit 1
          fi
          echo "response top-level type: $(jq -r 'type' /tmp/services.json)" >> /tmp/diag.log
          echo "response top-level keys: $(jq -r 'if type=="object" then (keys|join(",")) else "n/a" end' /tmp/services.json)" >> /tmp/diag.log
          echo "workspace services (name | slug | type | id):" >> /tmp/services-list.txt
          jq -r '.. | objects | select(has("slug")) | [(.name//"?"), .slug, (.type//"?"), (.id//"?")] | join(" | ")' /tmp/services.json | sort -u >> /tmp/services-list.txt
          echo "first element keys: $(jq -r 'if type=="array" and (.[0]|type)=="object" then (.[0]|keys|join(",")) else "n/a" end' /tmp/services.json)" >> /tmp/diag.log
          cat /tmp/services-list.txt

      - name: Resolve the service identities
        run: |
          set -uo pipefail
          service_id_by_slug() {
            jq -r --arg slug "$1" '.. | objects | select(.slug==$slug) | .id // empty' /tmp/services.json | head -n 1
          }
          service_field_by_id() {
            jq -r --arg id "$1" --arg field "$2" '.. | objects | select(.id==$id) | .[$field] // empty' /tmp/services.json | head -n 1
          }
          TARGET_BACKEND_ID=$(service_id_by_slug "$EXPECTED_BACKEND_SLUG")
          TARGET_FRONTEND_ID=$(service_id_by_slug "$EXPECTED_FRONTEND_SLUG")
          SECRET_BACKEND_NAME=$(service_field_by_id "$BACKEND_SERVICE_ID" name)
          SECRET_BACKEND_SLUG=$(service_field_by_id "$BACKEND_SERVICE_ID" slug)
          SECRET_FRONTEND_NAME=$(service_field_by_id "$FRONTEND_SERVICE_ID" name)
          SECRET_FRONTEND_SLUG=$(service_field_by_id "$FRONTEND_SERVICE_ID" slug)
          echo "repository secret backend service id: name=$SECRET_BACKEND_NAME slug=$SECRET_BACKEND_SLUG" >> /tmp/diag.log
          echo "repository secret frontend service id: name=$SECRET_FRONTEND_NAME slug=$SECRET_FRONTEND_SLUG" >> /tmp/diag.log
          echo "selected backend service id: ${TARGET_BACKEND_ID:-none}" >> /tmp/diag.log
          echo "selected frontend service id: ${TARGET_FRONTEND_ID:-none}" >> /tmp/diag.log
          if [ -z "$TARGET_BACKEND_ID" ]; then
            echo "::error::no service with the slug '$EXPECTED_BACKEND_SLUG' was found; the workspace service list is in the report"
            exit 1
          fi
          if [ "$TARGET_BACKEND_ID" != "$BACKEND_SERVICE_ID" ]; then
            echo "::warning::the repository secret points at service $BACKEND_SERVICE_ID (slug '$SECRET_BACKEND_SLUG') while the product hostname needs the service with the slug '$EXPECTED_BACKEND_SLUG' ($TARGET_BACKEND_ID)"
            echo "the repository deploy secret and the product hostname point at different services" >> /tmp/diag.log
          fi
          echo "TARGET_BACKEND_ID=$TARGET_BACKEND_ID" >> "$GITHUB_ENV"
          echo "TARGET_FRONTEND_ID=$TARGET_FRONTEND_ID" >> "$GITHUB_ENV"
          echo "$EXPECTED_BACKEND_SLUG ($TARGET_BACKEND_ID)" > /tmp/backend-name.txt
          echo "${EXPECTED_FRONTEND_SLUG} (${TARGET_FRONTEND_ID:-not found})" > /tmp/frontend-name.txt

      - name: Verify the signing key against the live Clerk JWKS
        run: |
          set -euo pipefail
          curl -sS --fail-with-body "$CLERK_ISSUER/.well-known/jwks.json" -o /tmp/jwks.json
          KID=$(jq -r '[.keys[] | select(.use=="sig" or .use==null)][0].kid' /tmp/jwks.json)
          N=$(jq -r '[.keys[] | select(.use=="sig" or .use==null)][0].n' /tmp/jwks.json)
          printf '%s\n' "$CLERK_JWT_PUBLIC_KEY" > /tmp/key.pem
          MOD=$(openssl rsa -pubin -in /tmp/key.pem -noout -modulus | sed 's/^Modulus=//')
          NHEX=$(printf '%s' "$N" | python3 -c "import sys,base64;s=sys.stdin.read().strip();s+= '='*(-len(s)%4);print(base64.urlsafe_b64decode(s).hex().lstrip('0'))")
          MODHEX=$(printf '%s' "$MOD" | tr 'A-F' 'a-f' | sed 's/^0*//')
          echo "jwks kid=$KID" >> /tmp/diag.log
          if [ "$NHEX" != "$MODHEX" ]; then
            echo "::error::the configured public key does not match the live JWKS signing key"
            exit 1
          fi
          echo "the configured public key matches the live JWKS signing key" >> /tmp/diag.log
          echo "$KID" > /tmp/kid.txt

      - name: Read the current environment variable keys
        run: |
          set -uo pipefail
          : > /tmp/backend-keys.txt
          : > /tmp/frontend-keys.txt
          BACKEND_STATUS=$(curl -sS -o /tmp/backend-envvars.json -w "%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" "$RENDER_API/services/$TARGET_BACKEND_ID/env-vars")
          echo "GET /services/<backend>/env-vars -> HTTP $BACKEND_STATUS" >> /tmp/diag.log
          if [ "$BACKEND_STATUS" != "200" ]; then
            echo "::error::the Render API answered HTTP $BACKEND_STATUS for the backend env vars"
            exit 1
          fi
          echo "backend env var response type: $(jq -r 'type' /tmp/backend-envvars.json)" >> /tmp/diag.log
          jq -r '(if type=="array" then . else [] end) | map(if .envVar then .envVar else . end) | .[] | .key' /tmp/backend-envvars.json | sort | tee -a /tmp/backend-keys.txt
          if [ -n "$TARGET_FRONTEND_ID" ]; then
            FRONTEND_STATUS=$(curl -sS -o /tmp/frontend-envvars.json -w "%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" "$RENDER_API/services/$TARGET_FRONTEND_ID/env-vars")
            echo "GET /services/<frontend>/env-vars -> HTTP $FRONTEND_STATUS" >> /tmp/diag.log
            if [ "$FRONTEND_STATUS" = "200" ]; then
              jq -r '(if type=="array" then . else [] end) | map(if .envVar then .envVar else . end) | .[] | .key' /tmp/frontend-envvars.json | sort | tee -a /tmp/frontend-keys.txt
            fi
          fi

      - name: Configure nightlamp-api
        run: |
          set -uo pipefail
          : > /tmp/actions.log
          echo "backend env var object keys: $(jq -r '(if type=="array" then . else [] end) | map(if .envVar then .envVar else . end) | .[0] | (if . == null then "empty" else (keys|join(",")) end)' /tmp/backend-envvars.json)" >> /tmp/diag.log
          jq -r '(if type=="array" then . else [] end) | map(if .envVar then .envVar else . end) | .[] | [.key, (if .value == null then "NOVALUE" else (.value|tostring) end)] | @tsv' /tmp/backend-envvars.json | sort > /tmp/backend-values-before.txt
          MISSING=$(awk -F'\t' '$2=="NOVALUE"{print $1}' /tmp/backend-values-before.txt | tr '\n' ',')
          echo "variables whose value the API did not return: ${MISSING:-none}" >> /tmp/diag.log
          if [ -n "$MISSING" ]; then
            echo "::warning::a bulk replace would drop the variables listed above, refusing to run it"
            echo "refused the bulk replace (the API did not return every value)" >> /tmp/actions.log
            exit 0
          fi
          while IFS=$'\t' read -r k v; do printf '%s\t%s\n' "$k" "$(printf '%s' "$v" | sha256sum | cut -c1-16)"; done < /tmp/backend-values-before.txt | sort > /tmp/backend-hashes-before.txt
          jq -n --arg issuer "$CLERK_ISSUER" --arg pubkey "$CLERK_JWT_PUBLIC_KEY" --slurpfile current /tmp/backend-envvars.json \
            '($current[0] | (if type=="array" then . else [] end) | map(if .envVar then .envVar else . end) | map(select(.key != "CLERK_JWT_ISSUER" and .key != "CLERK_JWT_PUBLIC_KEY")) | map({key:.key, value:(.value|tostring)} + (if .type then {type:.type} else {} end)))) + [{key:"CLERK_JWT_ISSUER", value:$issuer}, {key:"CLERK_JWT_PUBLIC_KEY", value:$pubkey}]' > /tmp/backend-envvars-put.json
          jq -n --arg issuer "$CLERK_ISSUER" --arg pubkey "$CLERK_JWT_PUBLIC_KEY" --slurpfile current /tmp/backend-envvars.json \
            '($current[0] | (if type=="array" then . else [] end) | map(if .envVar then .envVar else . end) | map(select(.key != "CLERK_JWT_ISSUER" and .key != "CLERK_JWT_PUBLIC_KEY")) | map({key:.key, value:(.value|tostring)}))) + [{key:"CLERK_JWT_ISSUER", value:$issuer}, {key:"CLERK_JWT_PUBLIC_KEY", value:$pubkey}]' > /tmp/backend-envvars-put-notype.json
          STATUS=$(curl -sS -o /tmp/put.json -w "%{http_code}" -X PUT -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" --data-binary @/tmp/backend-envvars-put.json "$RENDER_API/services/$TARGET_BACKEND_ID/env-vars")
          echo "PUT env-vars (with type) -> HTTP $STATUS" >> /tmp/diag.log
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            STATUS2=$(curl -sS -o /tmp/put2.json -w "%{http_code}" -X PUT -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" --data-binary @/tmp/backend-envvars-put-notype.json "$RENDER_API/services/$TARGET_BACKEND_ID/env-vars")
            echo "PUT env-vars (without type) -> HTTP $STATUS2" >> /tmp/diag.log
            STATUS=$STATUS2
          fi
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "::error::the Render API answered HTTP $STATUS for the bulk replace"
            echo "failed the bulk replace (HTTP $STATUS)" >> /tmp/actions.log
            exit 1
          fi
          echo "added CLERK_JWT_ISSUER and CLERK_JWT_PUBLIC_KEY to the backend service" >> /tmp/actions.log
          sleep 3
          AFTER_STATUS=$(curl -sS -o /tmp/backend-envvars-after.json -w "%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" "$RENDER_API/services/$TARGET_BACKEND_ID/env-vars")
          echo "GET env-vars (after the replace) -> HTTP $AFTER_STATUS" >> /tmp/diag.log
          jq -r '(if type=="array" then . else [] end) | map(if .envVar then .envVar else . end) | .[] | [.key, (if .value == null then "NOVALUE" else (.value|tostring) end)] | @tsv' /tmp/backend-envvars-after.json | sort > /tmp/backend-values-after.txt
          while IFS=$'\t' read -r k v; do printf '%s\t%s\n' "$k" "$(printf '%s' "$v" | sha256sum | cut -c1-16)"; done < /tmp/backend-values-after.txt | sort > /tmp/backend-hashes-after.txt
          grep -v -e '^CLERK_JWT_ISSUER' -e '^CLERK_JWT_PUBLIC_KEY' /tmp/backend-hashes-after.txt > /tmp/backend-hashes-after-existing.txt
          if diff -q /tmp/backend-hashes-before.txt /tmp/backend-hashes-after-existing.txt > /dev/null 2>&1; then
            echo "every pre-existing variable kept exactly the same value (verified by hash)" >> /tmp/diag.log
            echo "all pre-existing variables verified unchanged" >> /tmp/actions.log
          else
            echo "::warning::the hash of at least one pre-existing variable changed"
            diff /tmp/backend-hashes-before.txt /tmp/backend-hashes-after-existing.txt >> /tmp/diag.log
            echo "a pre-existing variable changed value" >> /tmp/actions.log
          fi

      - name: Configure nightlamp-frontend when a variable is missing
        run: |
          set -uo pipefail
          if [ -z "$TARGET_FRONTEND_ID" ]; then
            echo "no frontend service with the slug nightlamp-frontend, skipping"
            exit 0
          fi
          decode_clerk_instance() {
            printf '%s' "$1" | python3 -c "import sys,base64;s=sys.stdin.read().strip();p=s.split('_',2);b=''.join(c for c in p[2] if c.isalnum() or c in '-_') if len(p)>2 else '';b=b+'='*(-len(b)%4);print(base64.urlsafe_b64decode(b).decode('utf-8','replace') if b else '')"
          }
          PUB_INSTANCE=$(decode_clerk_instance "$GITHUB_CLERK_PUBLISHABLE_KEY")
          SEC_INSTANCE=$(decode_clerk_instance "$GITHUB_CLERK_SECRET_KEY")
          echo "github publishable key instance: ${PUB_INSTANCE:-unknown}" >> /tmp/diag.log
          echo "github secret key instance: ${SEC_INSTANCE:-unknown}" >> /tmp/diag.log
          apply_frontend_var() {
            local key="$1" value="$2"
            local id status
            id=$(jq -r --arg k "$key" '(if type=="array" then . else [] end) | map(if .envVar then .envVar else . end) | map(select(.key==$k)) | .[0].id // ""' /tmp/frontend-envvars.json)
            if [ -n "$id" ]; then
              echo "$key: already present on the frontend service, left untouched"
              echo "present $key" >> /tmp/actions.log
              return 0
            fi
            if [ -z "$value" ]; then
              echo "::warning::$key is missing on the frontend service and no repository value is available"
              echo "missing $key" >> /tmp/actions.log
              return 0
            fi
            status=$(curl -sS -o "/tmp/post-$key.json" -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg k "$key" --arg v "$value" '{key:$k,value:$v}')" \
              "$RENDER_API/services/$TARGET_FRONTEND_ID/env-vars")
            echo "POST frontend $key -> HTTP $status" >> /tmp/diag.log
            if [ "$status" != "200" ] && [ "$status" != "201" ]; then
              echo "::error::the Render API answered HTTP $status when creating $key on the frontend service"
              return 1
            fi
            echo "$key: created on the frontend service"
            echo "created $key" >> /tmp/actions.log
          }
          if [ -z "$PUB_INSTANCE" ] || [ "$PUB_INSTANCE" != "$CLERK_INSTANCE" ]; then
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY not copied (instance mismatch)"
            echo "refused NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY (instance mismatch)" >> /tmp/actions.log
          else
            apply_frontend_var NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY "$GITHUB_CLERK_PUBLISHABLE_KEY" || echo "failed NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" >> /tmp/actions.log
          fi
          if [ -z "$SEC_INSTANCE" ] || [ "$SEC_INSTANCE" != "$CLERK_INSTANCE" ]; then
            echo "CLERK_SECRET_KEY not copied (instance mismatch)"
            echo "refused CLERK_SECRET_KEY (instance mismatch)" >> /tmp/actions.log
          else
            apply_frontend_var CLERK_SECRET_KEY "$GITHUB_CLERK_SECRET_KEY" || echo "failed CLERK_SECRET_KEY" >> /tmp/actions.log
          fi

      - name: Re-read the environment variable keys
        run: |
          set -uo pipefail
          : > /tmp/backend-keys-after.txt
          : > /tmp/frontend-keys-after.txt
          BACKEND_STATUS=$(curl -sS -o /tmp/backend-envvars-after.json -w "%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" "$RENDER_API/services/$TARGET_BACKEND_ID/env-vars")
          echo "GET /services/<backend>/env-vars (after) -> HTTP $BACKEND_STATUS" >> /tmp/diag.log
          if [ "$BACKEND_STATUS" = "200" ]; then
            jq -r '(if type=="array" then . else [] end) | map(if .envVar then .envVar else . end) | .[] | .key' /tmp/backend-envvars-after.json | sort | tee -a /tmp/backend-keys-after.txt
          fi
          if [ -n "$TARGET_FRONTEND_ID" ]; then
            FRONTEND_STATUS=$(curl -sS -o /tmp/frontend-envvars-after.json -w "%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" "$RENDER_API/services/$TARGET_FRONTEND_ID/env-vars")
            echo "GET /services/<frontend>/env-vars (after) -> HTTP $FRONTEND_STATUS" >> /tmp/diag.log
            if [ "$FRONTEND_STATUS" = "200" ]; then
              jq -r '(if type=="array" then . else [] end) | map(if .envVar then .envVar else . end) | .[] | .key' /tmp/frontend-envvars-after.json | sort | tee -a /tmp/frontend-keys-after.txt
            fi
          fi

      - name: Publish the key-only report
        if: always()
        run: |
          set -uo pipefail
          BACKEND_NAME=$(cat /tmp/backend-name.txt 2>/dev/null || echo 'unknown')
          FRONTEND_NAME=$(cat /tmp/frontend-name.txt 2>/dev/null || echo 'unknown')
          KID=$(cat /tmp/kid.txt 2>/dev/null || echo 'unknown')
          DIAG=$(tr '\n' ';' < /tmp/diag.log 2>/dev/null || echo '')
          jq -n \
            --arg run "$GITHUB_RUN_ID" \
            --arg sha "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg kid "$KID" \
            --arg backendName "$BACKEND_NAME" \
            --arg frontendName "$FRONTEND_NAME" \
            --arg diag "$DIAG" \
            --arg services "$(tr '\n' ';' < /tmp/services-list.txt 2>/dev/null || echo '')" \
            --arg actions "$(tr '\n' ';' < /tmp/actions.log 2>/dev/null || echo '')" \
            --arg backendBefore "$(tr '\n' ',' < /tmp/backend-keys.txt 2>/dev/null || echo '')" \
            --arg backendAfter "$(tr '\n' ',' < /tmp/backend-keys-after.txt 2>/dev/null || echo '')" \
            --arg frontendBefore "$(tr '\n' ',' < /tmp/frontend-keys.txt 2>/dev/null || echo '')" \
            --arg frontendAfter "$(tr '\n' ',' < /tmp/frontend-keys-after.txt 2>/dev/null || echo '')" \
            '{run:$run,sha:$sha,branch:$branch,backendService:$backendName,frontendService:$frontendName,jwksKid:$kid,diagnostics:$diag,workspaceServices:$services,actions:$actions,backendEnvVarKeysBefore:$backendBefore,backendEnvVarKeysAfter:$backendAfter,frontendEnvVarKeysBefore:$frontendBefore,frontendEnvVarKeysAfter:$frontendAfter,valuesIncluded:false}' > /tmp/report.json
          cat /tmp/report.json
          {
            echo "## Render auth configuration report"
            echo
            echo "- run: $GITHUB_RUN_ID"
            echo "- sha: $GITHUB_SHA"
            echo "- backend service: $BACKEND_NAME"
            echo "- frontend service: $(cat /tmp/frontend-name.txt 2>/dev/null || echo unknown)"
            echo "- jwks signing key id: $(cat /tmp/kid.txt 2>/dev/null || echo unknown)"
            echo "- diagnostics: $(tr '\n' ';' < /tmp/diag.log 2>/dev/null || echo '')"
            echo "- actions: $(tr '\n' ';' < /tmp/actions.log 2>/dev/null || echo '')"
            echo "- backend env var keys before: $(tr '\n' ',' < /tmp/backend-keys.txt 2>/dev/null || echo '')"
            echo "- backend env var keys after: $(tr '\n' ',' < /tmp/backend-keys-after.txt 2>/dev/null || echo '')"
            echo "- frontend env var keys before: $(tr '\n' ',' < /tmp/frontend-keys.txt 2>/dev/null || echo '')"
            echo "- frontend env var keys after: $(tr '\n' ',' < /tmp/frontend-keys-after.txt 2>/dev/null || echo '')"
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "nightlamp-ci"
          git config user.email "ci@nightlamp.local"
          git fetch --depth=1 origin "$REPORT_BRANCH" || true
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout -B "$REPORT_BRANCH" FETCH_HEAD
          fi
          mkdir -p reports
          cp /tmp/report.json reports/render-auth-config.json
          git add reports/render-auth-config.json
          git commit -m "render auth configuration report $GITHUB_RUN_ID" || true
          git push origin "HEAD:$REPORT_BRANCH"
