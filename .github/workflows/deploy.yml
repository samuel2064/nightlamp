name: Deploy to Render

on:
  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and test before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install backend deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run backend tests
        run: npm test
      - name: Build backend
        run: npm run build

  verify-frontend:
    name: Verify frontend before deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Node 22 is the runtime declared by frontend/package.json engines: the
      # focused test suite uses native TypeScript type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test-output.txt
      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://nightlamp-api.onrender.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  deploy-backend:
    name: Deploy backend to Render
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
    steps:
      - name: Validate Render configuration
        run: |
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY secret is missing or empty"; exit 1; }
          [[ "$SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]] || { echo "::error::RENDER_BACKEND_SERVICE_ID is missing or malformed"; exit 1; }
      - name: Trigger Render backend deploy
        run: |
          curl -fsS -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

  deploy-frontend:
    name: Deploy frontend service
    needs: [verify, verify-frontend]
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
    steps:
      - name: Validate Render configuration
        run: |
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY secret is missing or empty"; exit 1; }
          [[ "$SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]] || { echo "::error::RENDER_FRONTEND_SERVICE_ID is missing or malformed"; exit 1; }
      - name: Trigger Render frontend deploy
        run: |
          curl -fsS -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

  smoke:
    name: Post-deploy smoke test
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for deployment to stabilize
        run: sleep 60
      - name: Check backend health
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nightlamp-api.onrender.com/api/health" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 20
          done
          test "$STATUS" = "200" && echo "Backend healthy" || { echo "Backend smoke failed"; exit 1; }
      - name: Check backend storage durability state
        run: |
          # The deploy gate must be able to see the two states that lose tenant
          # data: a backend serving the postgres adapter, and a SQLite file that
          # is not on the declared persistent mount. The gate reads the public
          # health endpoint only - no credential, no production setting.
          node scripts/deploy-storage-gate.mjs --url "https://nightlamp-api.onrender.com/api/health"
      - name: Check backend authorization gate (protected route must answer 401)
        run: |
          # A protected backend route must answer 401 for an anonymous caller.
          # 200 means the P0 gate is not deployed (the old build is serving).
          # 503 with AUTH_NOT_CONFIGURED means the gate is live but
          # CLERK_JWT_ISSUER / CLERK_JWT_PUBLIC_KEY are missing on
          # nightlamp-api - fix forward and redeploy, do not roll back.
          # Any other 5xx is a Render cold start, so keep retrying.
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /tmp/gate_body -w "%{http_code}" \
              "https://nightlamp-api.onrender.com/api/events" || true)
            BODY=$(head -c 200 /tmp/gate_body)
            echo "Attempt $i: /api/events HTTP $STATUS :: $BODY"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then break; fi
            if [ "$STATUS" = "503" ] && echo "$BODY" | grep -qi "AUTH_NOT_CONFIGURED"; then break; fi
            sleep 20
          done
          if [ "$STATUS" = "200" ]; then
            echo "::error::Protected backend route answered 200 - the P0 authorization gate is not deployed"
            exit 1
          fi
          if echo "$BODY" | grep -qi "AUTH_NOT_CONFIGURED"; then
            echo "::error::Protected backend route answered 503 AUTH_NOT_CONFIGURED - the Clerk JWT variables are missing on nightlamp-api"
            exit 1
          fi
          if [ "$STATUS" = "401" ]; then
            echo "Backend authorization gate live (anonymous request refused)"
          else
            echo "::error::Protected backend route returned $STATUS after retries :: $BODY"
            exit 1
          fi
      - name: Check frontend root
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nightlamp-frontend.onrender.com/" || true)
          echo "Frontend / HTTP $STATUS"
          test "$STATUS" = "200" && echo "Frontend root healthy" || { echo "Frontend root smoke failed"; exit 1; }
      - name: Check frontend dashboard (must not be 404)
        run: |
          # Clerk v6 serves notFound() (404) to requests that do not look like
          # page requests, so the probe has to send a browser Accept header.
          # A browser gets 307/308 (redirect to sign-in); a signed-in session
          # gets 200. A 404 here means the route is really missing.
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              "https://nightlamp-frontend.onrender.com/dashboard" || true)
            echo "Attempt $i: /dashboard HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then break; fi
            sleep 20
          done
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
            echo "Frontend /dashboard healthy (auth redirect OK)"
          else
            echo "::error::Frontend /dashboard returned $STATUS - dashboard route missing or broken"
            exit 1
          fi
      - name: Check frontend dashboard playbooks
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              "https://nightlamp-frontend.onrender.com/dashboard/playbooks" || true)
            echo "Attempt $i: /dashboard/playbooks HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then break; fi
            sleep 20
          done
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
            echo "Frontend /dashboard/playbooks healthy (auth redirect OK)"
          else
            echo "::error::Frontend /dashboard/playbooks returned $STATUS - route missing or broken"
            exit 1
          fi
      - name: Check frontend tRPC endpoint
        run: |
          # The route is /api/trpc/[trpc], so probe a real procedure path. A
          # mounted route answers with a JSON envelope (200, or 401 once the
          # procedure is protected). Only an HTML 404 means the route is absent.
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /tmp/trpc_body -w "%{http_code}" \
              -H "Accept: application/json" \
              "https://nightlamp-frontend.onrender.com/api/trpc/health.status" || true)
            BODY=$(head -c 200 /tmp/trpc_body)
            echo "Attempt $i: /api/trpc/health.status HTTP $STATUS :: $BODY"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then break; fi
            sleep 20
          done
          if [ "$STATUS" = "404" ] && echo "$BODY" | grep -qi "<!DOCTYPE html>"; then
            echo "::error::Frontend /api/trpc returned an HTML 404 - tRPC handler missing"
            exit 1
          fi
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
            echo "Frontend /api/trpc route mounted"
          else
            echo "::error::Frontend /api/trpc/health.status returned $STATUS after retries"
            exit 1
          fi
      - name: Check frontend API health route
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: application/json" \
              "https://nightlamp-frontend.onrender.com/api/health" || true)
            echo "Attempt $i: /api/health HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 20
          done
          test "$STATUS" = "200" || { echo "::error::Frontend API health route missing (/api/health returned $STATUS)"; exit 1; }
          curl -s -H "Accept: application/json" "https://nightlamp-frontend.onrender.com/api/health" | head -c 500; echo

  notify:
    name: Deployment notification
    needs: [smoke]
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Post status to webhook
        if: ${{ always() && env.WEBHOOK != '' }}
        run: |
          curl -fsS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"text":"Nightlamp deploy finished on main. Job status: '"${{ job.status }}"'. Commit: '"${{ github.sha }}"'."}'

  alert-on-failure:
    name: Alert on deployment failure
    needs: [verify, verify-frontend, deploy-backend, deploy-frontend, smoke]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    env:
      VERIFY_RESULT: ${{ needs.verify.result }}
      VERIFY_FRONTEND_RESULT: ${{ needs['verify-frontend'].result }}
      DEPLOY_BACKEND_RESULT: ${{ needs['deploy-backend'].result }}
      DEPLOY_FRONTEND_RESULT: ${{ needs['deploy-frontend'].result }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Determine failed job
        id: failed-job
        run: |
          FAILED=""
          if [ "$VERIFY_RESULT" = "failure" ]; then FAILED="verify"; fi
          if [ "$VERIFY_FRONTEND_RESULT" = "failure" ]; then FAILED="verify-frontend"; fi
          if [ "$DEPLOY_BACKEND_RESULT" = "failure" ]; then FAILED="deploy-backend"; fi
          if [ "$DEPLOY_FRONTEND_RESULT" = "failure" ]; then FAILED="deploy-frontend"; fi
          if [ "$SMOKE_RESULT" = "failure" ]; then FAILED="smoke"; fi
          echo "failed_job=$FAILED" >> $GITHUB_OUTPUT
      - name: Post failure alert to webhook
        if: ${{ env.WEBHOOK != '' }}
        run: |
          FAILED_JOB="${{ steps.failed-job.outputs.failed_job }}"
          curl -fsS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"text":"Nightlamp DEPLOYMENT FAILURE on main","attachments":[{"color":"danger","fields":[{"title":"Failed Job","value":"'"$FAILED_JOB"'"},{"title":"Commit","value":"'"${{ github.sha }}"'"},{"title":"Workflow","value":"'"${{ github.workflow }}"'"},{"title":"Run URL","value":"'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"}]}]}'
