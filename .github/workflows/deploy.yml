name: Deploy to Render

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  verify:
    name: Verify and test before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install backend deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run backend tests
        run: npm test
      - name: Build backend
        run: npm run build

  deploy-backend:
    name: Deploy backend to Render
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
    steps:
      - name: Validate Render configuration
        run: |
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY secret is missing or empty"; exit 1; }
          [[ "$SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]] || { echo "::error::RENDER_BACKEND_SERVICE_ID is missing or malformed"; exit 1; }
      - name: Trigger Render backend deploy
        run: |
          curl -fsS -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

  deploy-frontend:
    name: Deploy frontend service
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
    steps:
      - name: Validate Render configuration
        run: |
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY secret is missing or empty"; exit 1; }
          [[ "$SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]] || { echo "::error::RENDER_FRONTEND_SERVICE_ID is missing or malformed"; exit 1; }
      - name: Trigger Render frontend deploy
        run: |
          curl -fsS -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

  smoke:
    name: Post-deploy smoke test
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 60
      - name: Check backend health
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nightlamp-api.onrender.com/api/health" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 20
          done
          test "$STATUS" = "200" && echo "Backend healthy" || { echo "Backend smoke failed"; exit 1; }
      - name: Check frontend root
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nightlamp-frontend.onrender.com/" || true)
          echo "Frontend / HTTP $STATUS"
          test "$STATUS" = "200" && echo "Frontend root healthy" || { echo "Frontend root smoke failed"; exit 1; }
      - name: Check frontend dashboard (must not be 404)
        run: |
          # Clerk v6 serves notFound() (404) to requests that do not look like
          # page requests, so the probe has to send a browser Accept header.
          # A browser gets 307/308 (redirect to sign-in); a signed-in session
          # gets 200. A 404 here means the route is really missing.
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              "https://nightlamp-frontend.onrender.com/dashboard" || true)
            echo "Attempt $i: /dashboard HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then break; fi
            sleep 20
          done
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
            echo "Frontend /dashboard healthy (auth redirect OK)"
          else
            echo "::error::Frontend /dashboard returned $STATUS - dashboard route missing or broken"
            exit 1
          fi
      - name: Check frontend dashboard playbooks
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              "https://nightlamp-frontend.onrender.com/dashboard/playbooks" || true)
            echo "Attempt $i: /dashboard/playbooks HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then break; fi
            sleep 20
          done
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
            echo "Frontend /dashboard/playbooks healthy (auth redirect OK)"
          else
            echo "::error::Frontend /dashboard/playbooks returned $STATUS - route missing or broken"
            exit 1
          fi
      - name: Check frontend tRPC endpoint
        run: |
          # The route is /api/trpc/[trpc], so probe a real procedure path. A
          # mounted route answers with a JSON envelope (200, or 401 once the
          # procedure is protected). Only an HTML 404 means the route is absent.
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /tmp/trpc_body -w "%{http_code}" \
              -H "Accept: application/json" \
              "https://nightlamp-frontend.onrender.com/api/trpc/health.status" || true)
            BODY=$(head -c 200 /tmp/trpc_body)
            echo "Attempt $i: /api/trpc/health.status HTTP $STATUS :: $BODY"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then break; fi
            sleep 20
          done
          if [ "$STATUS" = "404" ] && echo "$BODY" | grep -qi "<!DOCTYPE html>"; then
            echo "::error::Frontend /api/trpc returned an HTML 404 - tRPC handler missing"
            exit 1
          fi
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
            echo "Frontend /api/trpc route mounted"
          else
            echo "::error::Frontend /api/trpc/health.status returned $STATUS after retries"
            exit 1
          fi
      - name: Check frontend API health route
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: application/json" \
              "https://nightlamp-frontend.onrender.com/api/health" || true)
            echo "Attempt $i: /api/health HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 20
          done
          test "$STATUS" = "200" || { echo "::error::Frontend API health route missing (/api/health returned $STATUS)"; exit 1; }
          curl -s -H "Accept: application/json" "https://nightlamp-frontend.onrender.com/api/health" | head -c 500; echo

  notify:
    name: Deployment notification
    needs: [smoke]
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Post status to webhook
        if: ${{ always() && env.WEBHOOK != '' }}
        run: |
          curl -fsS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"text":"Nightlamp deploy finished on main. Job status: '"${{ job.status }}"'. Commit: '"${{ github.sha }}"'."}'