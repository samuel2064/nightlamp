name: Verify controlled identities

on:
  workflow_dispatch:
  push:
    branches:
      - ops/controlled-identity-verification
  pull_request:
    branches: [main]
    paths:
      - 'ops/verify-controlled-identities.js'
      - 'ops/guard-harness.js'
      - 'ops/fixtures/**'

permissions:
  contents: write

env:
  RENDER_API: https://api.render.com/v1
  CLERK_API: https://api.clerk.com/v1
  CLERK_INSTANCE: capable-goldfish-98.clerk.accounts.dev
  CLERK_ISSUER: https://capable-goldfish-98.clerk.accounts.dev
  NIGHTLAMP_API: https://nightlamp-api.onrender.com
  REPORT_BRANCH: ops/render-auth-report
  RESULT_FILE: /tmp/controlled-identity-result.json
  FIXTURE_FILE: ops/fixtures/stale-harness.js

jobs:
  guard-checks:
    name: Guard Checks (ownership claim + identifier redaction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run ownership claim guard on current harness
        run: |
          node ops/guard-harness.js ops/verify-controlled-identities.js
      
      - name: Run ownership claim guard on stale fixture (must FAIL)
        run: |
          if node ops/guard-harness.js ops/fixtures/stale-harness.js; then
            echo "::error::Stale harness fixture should FAIL the guard but passed"
            exit 1
          else
            echo "PASS: Stale harness fixture correctly FAILS the guard"
          fi
      
      - name: Run identifier redaction guard on fixture report (PR + matrix)
        run: |
          node ops/guard-harness.js ops/verify-controlled-identities.js ops/fixtures/status-report.json

  verify:
    name: Verify controlled identities and run NOC-280/NOC-274 production matrix
    needs: guard-checks
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Preflight
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY secret is missing or empty"; exit 1; }
          test -n "$FRONTEND_SERVICE_ID" || { echo "::error::RENDER_FRONTEND_SERVICE_ID secret is missing or empty"; exit 1; }
          echo "preflight ok"

      - name: Run the controlled identity verification
        run: |
          set -uo pipefail
          export FRONTEND_SERVICE_ID
          node ops/verify-controlled-identities.js
          echo "--- the report, values excluded ---"
          cat "$RESULT_FILE"

      - name: Run identifier redaction guard on report
        if: always()
        run: |
          if [ -f "$RESULT_FILE" ]; then
            node ops/guard-harness.js ops/verify-controlled-identities.js "$RESULT_FILE"
          fi

      - name: Publish the status-only report
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f "$RESULT_FILE" ]; then
            echo '{"error":"the verification script produced no report","valuesIncluded":false,"bodiesIncluded":false}' > /tmp/report.json
          else
            cp "$RESULT_FILE" /tmp/report.json
          fi
          {
            echo "## Controlled identity verification"
            echo
            jq -r '"- probes as expected: \(.probesPassed // 0)/\(.probesTotal // 0)"' /tmp/report.json
            jq -r '.probes[]? | "- \(.ok|if . then "PASS" else "FAIL" end) \(.label): expected \(.expected|join("/")) got \(.status)\(if .code then " " + .code else "" end)"' /tmp/report.json
            jq -r '"- error: \(.error // "none")"' /tmp/report.json
            jq -r '"- owner identified: \(.identity.ownerIdentified // false)"' /tmp/report.json
            jq -r '"- member identified: \(.identity.memberIdentified // false)"' /tmp/report.json
            jq -r '"- test team created: \(.identity.testTeamCreated // false)"' /tmp/report.json
            jq -r '"- test team removed: \(.identity.testTeamRemoved // false)"' /tmp/report.json
            jq -r '"- full matrix run: \(.identity.fullMatrixRun // false)"' /tmp/report.json
            jq -r '"- run invalid: \(.identity.runInvalid // false)"' /tmp/report.json
            if [ "$(jq -r '.identity.runInvalidReason // ""' /tmp/report.json)" != "" ]; then
              jq -r '"- run invalid reason: \(.identity.runInvalidReason)"' /tmp/report.json
            fi
            jq -r '"- no token, secret or response body is included in this report"' /tmp/report.json
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "nightlamp-ci"
          git config user.email "ci@nightlamp.local"
          git fetch --depth=1 origin "$REPORT_BRANCH" || true
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout -B "$REPORT_BRANCH" FETCH_HEAD
          fi
          mkdir -p reports
          cp /tmp/report.json reports/controlled-identity-verification.json
          git add reports/controlled-identity-verification.json
          git commit -m "controlled identity verification report $GITHUB_RUN_ID" || true
          git push origin "HEAD:$REPORT_BRANCH"