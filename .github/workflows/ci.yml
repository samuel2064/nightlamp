name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encoding-check:
    name: Encoding Check (UTF-8 only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run encoding check
        run: ./scripts/check-encoding.sh

  backend:
    name: Backend (lint / typecheck / test)
    runs-on: ubuntu-latest
    needs: encoding-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (tsc strict smoke)
        run: npx tsc --noEmit --pretty

      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-test-output.txt

      - name: Test the staging provisioner
        run: npm run test:staging-provision

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-output
          path: ci-test-output.txt

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    needs: encoding-check
    steps:
      - uses: actions/checkout@v4

      # Node 22 is the runtime declared by frontend/package.json engines: the
      # focused test suite uses native TypeScript type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test-output.txt

      - name: Upload frontend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-output
          path: frontend/frontend-test-output.txt

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://nightlamp-api.onrender.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}